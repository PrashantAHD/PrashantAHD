<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="206" viewBox="0 0 1000 206" fill="none" role="img" aria-label="Git-Admin: GitHub org access ops, zero dependencies.">
<title>Git-Admin: GitHub org access ops, zero dependencies.</title>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.comet{animation:comet 7s linear infinite}
@keyframes comet{to{stroke-dashoffset:-100}}
</style>
<defs>
  <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1226"/>
  </linearGradient>
  <linearGradient id="fbd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00e5ff" stop-opacity=".75"/>
    <stop offset=".5" stop-color="#8b5cf6" stop-opacity=".35"/>
    <stop offset="1" stop-color="#ff2e88" stop-opacity=".55"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x=".5" y=".5" width="999" height="205" rx="16" fill="url(#fbg)" stroke="url(#fbd)"/>
<rect class="comet" x="1" y="1" width="998" height="204" rx="15" pathLength="100" stroke="#00e5ff" stroke-width="2" stroke-dasharray="10 90" filter="url(#glow)"/>
<rect x="22" y="20" width="101" height="22" rx="11" fill="#00e5ff" fill-opacity=".1" stroke="#00e5ff" stroke-opacity=".5"/><text class="mono" x="72" y="35" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#00e5ff">● PUBLIC REPO</text>
<rect x="131" y="20" width="94" height="22" rx="11" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".6"/><text class="mono" x="178" y="35" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#8b5cf6">CLIENT · CSX</text>
<text class="mono" x="978" y="35" text-anchor="end" font-size="11.5" fill="#7d8aa5" xml:space="preserve" style="white-space:pre"><tspan fill="#3572A5">●</tspan> Python</text>
<text class="sans" x="22" y="82" font-size="23" font-weight="800" fill="#e6edf3">Git-Admin</text>
<text class="mono" x="22" y="106" font-size="12" fill="#00e5ff">› GitHub org access ops, zero dependencies.</text>
<text class="sans" x="22" y="134" font-size="13.5" fill="#b4bfd3">Single-file Python CLI for bulk GitHub org administration: team membership, repository permissions, Artifactory Actions-secret</text>
<text class="sans" x="22" y="153" font-size="13.5" fill="#b4bfd3">access and Copilot cloud-agent enablement, with confirmations and per-repo results.</text>
<g><rect x="22.0" y="166.0" width="59.1" height="22" rx="11.0" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="51.5" y="180.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">Python</text></g>
<g><rect x="88.1" y="166.0" width="85.1" height="22" rx="11.0" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="130.6" y="180.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">GitHub API</text></g>
<g><rect x="180.2" y="166.0" width="39.5" height="22" rx="11.0" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="199.9" y="180.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">IAM</text></g>
<g><rect x="226.7" y="166.0" width="117.7" height="22" rx="11.0" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="285.5" y="180.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">Least privilege</text></g>
<g><rect x="351.3" y="166.0" width="65.6" height="22" rx="11.0" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="384.1" y="180.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">Copilot</text></g>
<g><rect x="423.9" y="166.0" width="130.7" height="22" rx="11.0" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="489.2" y="180.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">Zero dependencies</text></g>
<text class="mono" x="978" y="182" text-anchor="end" font-size="11" font-weight="700" letter-spacing="1.5" fill="#00e5ff">OPEN REPO ↗</text>
</svg>
