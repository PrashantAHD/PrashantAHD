<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="206" viewBox="0 0 1000 206" fill="none" role="img" aria-label="Agent-Doorbell: Human-in-the-loop for AI coding agents, from your phone.">
<title>Agent-Doorbell: Human-in-the-loop for AI coding agents, from your phone.</title>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.comet{animation:comet 7s linear infinite}
@keyframes comet{to{stroke-dashoffset:-100}}
</style>
<defs>
  <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1226"/>
  </linearGradient>
  <linearGradient id="fbd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00e5ff" stop-opacity=".75"/>
    <stop offset=".5" stop-color="#8b5cf6" stop-opacity=".35"/>
    <stop offset="1" stop-color="#ff2e88" stop-opacity=".55"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x=".5" y=".5" width="999" height="205" rx="16" fill="url(#fbg)" stroke="url(#fbd)"/>
<rect class="comet" x="1" y="1" width="998" height="204" rx="15" pathLength="100" stroke="#00e5ff" stroke-width="2" stroke-dasharray="10 90" filter="url(#glow)"/>
<rect x="22" y="20" width="101" height="22" rx="11" fill="#00e5ff" fill-opacity=".1" stroke="#00e5ff" stroke-opacity=".5"/><text class="mono" x="72" y="35" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#00e5ff">● PUBLIC REPO</text>
<rect x="131" y="20" width="88" height="22" rx="11" fill="#00ff9d" fill-opacity=".12" stroke="#00ff9d" stroke-opacity=".6"/><text class="mono" x="175" y="35" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#00ff9d">OPEN SOURCE</text>
<text class="mono" x="978" y="35" text-anchor="end" font-size="11.5" fill="#7d8aa5" xml:space="preserve" style="white-space:pre"><tspan fill="#3572A5">●</tspan> Python</text>
<text class="sans" x="22" y="82" font-size="23" font-weight="800" fill="#e6edf3">Agent-Doorbell</text>
<text class="mono" x="22" y="106" font-size="12" fill="#00e5ff">› Human-in-the-loop for AI coding agents, from your phone.</text>
<text class="sans" x="22" y="134" font-size="13.5" fill="#b4bfd3">Your VS Code Copilot agents ring your phone when they need you: approve commands, answer questions and send prompts from Telegram.</text>
<text class="sans" x="22" y="153" font-size="13.5" fill="#b4bfd3">Laptop-first, first answer wins, signed local traffic, fails safe.</text>
<g><rect x="22.0" y="166.0" width="65.6" height="22" rx="11.0" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="54.8" y="180.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">VS Code</text></g>
<g><rect x="94.6" y="166.0" width="111.1" height="22" rx="11.0" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="150.1" y="180.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">GitHub Copilot</text></g>
<g><rect x="212.7" y="166.0" width="72.1" height="22" rx="11.0" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="248.7" y="180.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">Telegram</text></g>
<g><rect x="291.8" y="166.0" width="130.7" height="22" rx="11.0" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="357.1" y="180.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">Human-in-the-loop</text></g>
<g><rect x="429.5" y="166.0" width="72.1" height="22" rx="11.0" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="465.5" y="180.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">96 tests</text></g>
<text class="mono" x="978" y="182" text-anchor="end" font-size="11" font-weight="700" letter-spacing="1.5" fill="#00e5ff">OPEN REPO ↗</text>
</svg>
