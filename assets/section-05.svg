<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="58" viewBox="0 0 1000 58" fill="none" role="img" aria-label="05 ARSENAL">
<title>05 ARSENAL</title>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.glint{animation:glint 4.5s ease-in-out infinite}
@keyframes glint{0%{transform:translateX(-160px)}70%,100%{transform:translateX(1060px)}}
</style>
<defs>
  <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1226"/>
  </linearGradient>
  <linearGradient id="fbd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00e5ff" stop-opacity=".75"/>
    <stop offset=".5" stop-color="#8b5cf6" stop-opacity=".35"/>
    <stop offset="1" stop-color="#ff2e88" stop-opacity=".55"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x=".5" y=".5" width="999" height="57" rx="12" fill="url(#fbg)" stroke="url(#fbd)"/>
<defs><linearGradient id="sl" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff"/>
<stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff2e88" stop-opacity=".2"/></linearGradient>
<linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="sc"><rect x="1" y="1" width="998" height="56" rx="11"/></clipPath></defs>
<g clip-path="url(#sc)"><rect class="glint" x="0" y="0" width="140" height="58" fill="url(#gl)" transform="skewX(-20)"/>
<rect x="0" y="55" width="1000" height="3" fill="url(#sl)"/></g>
<text class="sans" x="22" y="41" font-size="30" font-weight="800" fill="none" stroke="#00e5ff" stroke-width="1.2">05</text>
<text class="sans" x="74" y="38" font-size="19" font-weight="800" letter-spacing="4" fill="#e6edf3">ARSENAL</text>
<rect class="blink" x="970" y="24" width="9" height="15" fill="#00ff9d"/>
<text class="mono" x="960" y="37" text-anchor="end" font-size="12" fill="#7d8aa5">// tools of the trade</text>
</svg>
