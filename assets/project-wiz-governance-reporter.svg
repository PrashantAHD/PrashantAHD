<g><rect x="68.5" y="196.0" width="85.1" height="22" rx="11.0" fill="#ffb020" fill-opacity=".08" stroke="#ffb020" stroke-opacity=".55"/><text x="111.1" y="210.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">Governance</text></g>
<g><rect x="160.6" y="196.0" width="91.6" height="22" rx="11.0" fill="#ffb020" fill-opacity=".08" stroke="#ffb020" stroke-opacity=".55"/><text x="206.4" y="210.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">-80% effort</text></g>
<text class="mono" x="468" y="212" text-anchor="end" font-size="11" font-weight="700" letter-spacing="1.5" fill="#ffb020">◆ INTERNAL TOOLING</text>
