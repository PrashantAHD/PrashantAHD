<svg xmlns="http://www.w3.org/2000/svg" width="490" height="236" viewBox="0 0 490 236" fill="none" role="img" aria-label="wiz-governance-reporter: Cloud security governance, automated.">
<title>wiz-governance-reporter: Cloud security governance, automated.</title>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.comet{animation:comet 7s linear infinite}
@keyframes comet{to{stroke-dashoffset:-100}}
</style>
<defs>
  <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1226"/>
  </linearGradient>
  <linearGradient id="fbd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffb020" stop-opacity=".75"/>
    <stop offset=".5" stop-color="#8b5cf6" stop-opacity=".35"/>
    <stop offset="1" stop-color="#ff2e88" stop-opacity=".55"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x=".5" y=".5" width="489" height="235" rx="16" fill="url(#fbg)" stroke="url(#fbd)"/>
<rect class="comet" x="1" y="1" width="488" height="234" rx="15" pathLength="100" stroke="#ffb020" stroke-width="2" stroke-dasharray="10 90" filter="url(#glow)"/>
<rect x="22" y="20" width="144" height="22" rx="11" fill="#ffb020" fill-opacity=".1" stroke="#ffb020" stroke-opacity=".5"/><text class="mono" x="94" y="35" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#ffb020">● PRIVATE · INTERNAL</text>
<rect x="174" y="20" width="132" height="22" rx="11" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".6"/><text class="mono" x="240" y="35" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#8b5cf6">CLIENT · CAREFIRST</text>
<text class="mono" x="468" y="35" text-anchor="end" font-size="11.5" fill="#7d8aa5" xml:space="preserve" style="white-space:pre"><tspan fill="#3572A5">●</tspan> Python</text>
<text class="sans" x="22" y="82" font-size="23" font-weight="800" fill="#e6edf3">wiz-governance-reporter</text>
<text class="mono" x="22" y="106" font-size="12" fill="#ffb020">› Cloud security governance, automated.</text>
<text class="sans" x="22" y="134" font-size="13.5" fill="#b4bfd3">Turns Wiz exports into governance workbooks, executive</text>
<text class="sans" x="22" y="153" font-size="13.5" fill="#b4bfd3">dashboards and operational presentations with baseline carry-</text>
<text class="sans" x="22" y="172" font-size="13.5" fill="#b4bfd3">forward, cutting reporting effort by 80%.</text>
