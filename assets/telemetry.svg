<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="342" viewBox="0 0 1000 342" fill="none" role="img" aria-label="Live GitHub telemetry dashboard">
<title>Live GitHub telemetry dashboard</title>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.tile{animation:tup .7s ease-out both}
@keyframes tup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s ease-out .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.area{animation:afade 1.6s ease-out 1.6s both}
@keyframes afade{from{opacity:0}to{opacity:1}}
.scanx{animation:scanx 5s linear infinite}
@keyframes scanx{from{transform:translateX(0)}to{transform:translateX(560px)}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s ease-out both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<defs>
  <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1226"/>
  </linearGradient>
  <linearGradient id="fbd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00e5ff" stop-opacity=".75"/>
    <stop offset=".5" stop-color="#8b5cf6" stop-opacity=".35"/>
    <stop offset="1" stop-color="#ff2e88" stop-opacity=".55"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x=".5" y=".5" width="999" height="341" rx="16" fill="url(#fbg)" stroke="url(#fbd)"/>
<defs>
  <linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
  <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity=".4"/>
    <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient>
  <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#00ff9d"/><stop offset=".5" stop-color="#00e5ff"/>
    <stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <linearGradient id="sx" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
    <stop offset="1" stop-color="#00e5ff" stop-opacity=".25"/></linearGradient>
</defs>
