<svg xmlns="http://www.w3.org/2000/svg" width="312" height="46" viewBox="0 0 312 46" fill="none" role="img" aria-label="Microsoft Certified: Cybersecurity Architect Expert">
<title>Microsoft Certified: Cybersecurity Architect Expert</title>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.shine{animation:shine 4s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-80px)}55%,100%{transform:translateX(420px)}}
</style>
<defs>
  <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1226"/>
  </linearGradient>
  <linearGradient id="fbd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00a4ef" stop-opacity=".75"/>
    <stop offset=".5" stop-color="#8b5cf6" stop-opacity=".35"/>
    <stop offset="1" stop-color="#ff2e88" stop-opacity=".55"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x=".5" y=".5" width="311" height="45" rx="23" fill="url(#fbg)" stroke="url(#fbd)"/>
<defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/>
<stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="bc"><rect x="1" y="1" width="310" height="44" rx="22"/></clipPath></defs>
<g clip-path="url(#bc)"><rect class="shine" x="0" y="0" width="60" height="46" fill="url(#sh)" transform="skewX(-20)"/></g>
<rect x="15" y="11" width="11" height="11" fill="#f25022"/><rect x="27" y="11" width="11" height="11" fill="#7fba00"/><rect x="15" y="23" width="11" height="11" fill="#00a4ef"/><rect x="27" y="23" width="11" height="11" fill="#ffb900"/><text class="mono" x="50" y="19" font-size="9.5" font-weight="700" letter-spacing="2" fill="#00a4ef">MICROSOFT CERTIFIED</text><text class="sans" x="50" y="35" font-size="13.5" font-weight="700" fill="#e6edf3">Cybersecurity Architect Expert</text>
</svg>
