<g><rect x="114.1" y="196.0" width="39.5" height="22" rx="11.0" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="133.9" y="210.8" text-anchor="middle" class="mono" font-size="10.5" fill="#e6edf3">IAM</text></g>
