<svg xmlns="http://www.w3.org/2000/svg" width="490" height="104" viewBox="0 0 490 104" fill="none" role="img" aria-label="Aws Certified: Solutions Architect – Professional">
<title>Aws Certified: Solutions Architect – Professional</title>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.comet{animation:comet 6s linear infinite}
@keyframes comet{to{stroke-dashoffset:-100}}
.seal{animation:seal 12s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes seal{to{transform:rotate(360deg)}}
</style>
<defs>
  <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1226"/>
  </linearGradient>
  <linearGradient id="fbd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffb020" stop-opacity=".75"/>
    <stop offset=".5" stop-color="#8b5cf6" stop-opacity=".35"/>
    <stop offset="1" stop-color="#ff2e88" stop-opacity=".55"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x=".5" y=".5" width="489" height="103" rx="14" fill="url(#fbg)" stroke="url(#fbd)"/>
<rect class="comet" x="1" y="1" width="488" height="102" rx="13" pathLength="100"
 stroke="#ff9900" stroke-width="2" stroke-dasharray="8 92" filter="url(#glow)"/>
<polygon points="65.1,61.0 46.0,72.0 26.9,61.0 26.9,39.0 46.0,28.0 65.1,39.0" fill="#ff9900" fill-opacity=".14" stroke="#ff9900" stroke-width="2"/><text class="sans" x="46" y="54.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ff9900">AWS</text>
<text class="mono" x="86" y="34" font-size="10" font-weight="700" letter-spacing="2" fill="#ff9900">AWS CERTIFIED</text>
<text class="sans" x="86" y="60" font-size="17" font-weight="800" fill="#e6edf3">Solutions Architect – Professional</text>
<rect x="86" y="70" width="89" height="20" rx="10" fill="#ff9900" fill-opacity=".12" stroke="#ff9900" stroke-opacity=".55"/>
<text class="mono" x="130" y="84" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#ff9900">PROFESSIONAL</text>
<circle class="seal" cx="438" cy="42" r="22" stroke="#ff9900" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="438" cy="42" r="15" fill="#ff9900" fill-opacity=".15" stroke="#ff9900"/>
<path d="M431 42 l5 5 l9 -10" stroke="#00ff9d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text class="mono" x="438" y="88" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#ff9900">VERIFY ↗</text>
</svg>
