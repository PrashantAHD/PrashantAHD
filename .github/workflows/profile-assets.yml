name: Render profile assets

on:
  schedule:
    - cron: "17 3 * * *" # daily refresh of the live telemetry dashboard
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Render SVGs
        env:
          # Optional PROFILE_STATS_TOKEN (read-only PAT) also counts private contributions and org memberships.
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
        run: python scripts/render.py

      - name: Commit refreshed assets
        run: |
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo "No asset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore(assets): refresh profile telemetry"
          git push
